# world_swarm.yaml
#
# Gazebo world definition for the 3-drone swarm configuration used by
# leader_follower_mission.py. Replace this placeholder with your actual
# AeroStack2 world/model configuration (drone models, spawn poses, world
# plugins).
#
# Referenced by: ../scripts/launch_as2.bash

world_name: swarm_world

drones:
  - name: drone0   # Leader
    model: quadrotor_base
    spawn_pose: { x: 0.0, y: 0.0, z: 0.0, yaw: 0.0 }
  - name: drone1   # Follower 1
    model: quadrotor_base
    spawn_pose: { x: 1.5, y: -1.5, z: 0.0, yaw: 0.0 }
  - name: drone2   # Follower 2
    model: quadrotor_base
    spawn_pose: { x: -1.5, y: -1.5, z: 0.0, yaw: 0.0 }
